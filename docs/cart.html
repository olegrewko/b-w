  <style>
    /* ===== MINIMALIST GLOBAL STYLES ===== */
    :root {
      --color-space: #011932;
      --color-charcoal: #1a1a1a;
      --color-steel: #2d4059;
      --color-silver: #e0e0e0;
      --color-smoke: #f5f5f5;
      --color-vapor: #ffffff;
      --color-maroon: #8b0000;
      --color-gold: #d4af37;
      --color-cyan: #60d4d4;
      --color-border: rgba(0, 0, 0, 0.08);
      --shadow-subtle: 0 2px 12px rgba(0, 0, 0, 0.04);
      --shadow-elevated: 0 8px 32px rgba(0, 0, 0, 0.08);
      --radius-sm: 4px;
      --radius-md: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--color-charcoal);
      background: var(--color-vapor);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== MINIMALIST HEADER ===== */
    .header__top-inner {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-vapor);
    }

    .logo__title {
      font-family: 'Jost', sans-serif;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--color-space);
      transition: var(--transition);
    }

    .logo__title:hover {
      opacity: 0.7;
    }

    .menu__list {
      gap: 2rem;
    }

    .menu__list-link {
      font-weight: 500;
      color: var(--color-steel);
      position: relative;
      padding: 0.5rem 0;
    }

    .menu__list-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--color-space);
      transition: var(--transition);
    }

    .menu__list-link:hover::after {
      width: 100%;
    }



    /* ===== MINIMALIST PRODUCT GRID ===== */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    .fotorama {
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-subtle);
    }

    .desc h5 {
      font-family: 'Jost', sans-serif;
      font-weight: 600;
      font-size: 1.75rem;
      margin-bottom: 1rem;
      color: var(--color-space);
    }

    .desc p {
      color: var(--color-steel);
      margin-bottom: 1.5rem;
      line-height: 1.8;
    }

    /* ===== MINIMALIST RADIO BUTTONS ===== */
    /* .radio {
      display: inline-flex;
      align-items: center;
      margin-right: 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    } */
    .option {
      display: block;

      margin-top: 0.1rem;
      margin-bottom: 0.1rem;
    }

    .real-radio-black,
    .real-radio-white,
    .real-radio-brown {
      display: none;
    }

    /* .custom-radio-black,
    .custom-radio-white,
    .custom-radio-brown {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      margin-right: 0.5rem;
      position: relative;
      transition: var(--transition);
    } */

    /* .custom-radio-black {
      background: var(--color-space);
    }

    .custom-radio-white {
      background: var(--color-vapor);
      border-color: var(--color-silver);
    }

    .custom-radio-brown {
      background: #8B4513;
    } */

    /* .real-radio-black:checked+.custom-radio-black::after,
    .real-radio-white:checked+.custom-radio-white::after,
    .real-radio-brown:checked+.custom-radio-brown::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;

      background: var(--color-vapor);
    } */

    /* .custom-radio-text {
      font-size: 0.875rem;
      color: var(--color-steel);
    } */

    /* ===== MINIMALIST BUTTONS ===== */
    .card-info__btn--towishlist {
      max-width: 600px;
      height: 50px;
      width: 100%;
      padding: 10px 20px;
      background: var(--color-space);
      color: var(--color-vapor);
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .card-info__btn--towishlist:hover {
      background: transparent;
      color: black;
      border: 2px solid black;
      /* transform: translateY(-1px); */
      box-shadow: var(--shadow-subtle);
    }

    /* ===== MINIMALIST TABS ===== */
    .tabs {
      margin: 4rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .tabs__list {
      display: flex;
      gap: 0;
      padding: 0;
      margin: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs__list::-webkit-scrollbar {
      display: none;
    }

    .tabs__btn {
      padding: 1rem 2rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--color-steel);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .tabs__btn:hover {
      color: var(--color-space);
      background: var(--color-smoke);
    }

    .tabs__btn--active {
      color: var(--color-space);
      border-bottom-color: var(--color-space);
      font-weight: 600;
    }

    .tabs__btn-orange {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-space);
      border-radius: var(--radius-sm);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .tabs__btn-orange:hover {
      background: var(--color-smoke);
      border-color: var(--color-space);
    }

    .tabs__content {
      padding: 2rem 0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== MINIMALIST CART SECTION ===== */
    .cart-container {
      padding: 2rem;
      background: var(--color-vapor);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
    }

    .cart-title {
      font-family: 'Jost', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--color-space);
      margin: 0;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .cart-item:hover {
      border-color: var(--color-silver);
      box-shadow: var(--shadow-subtle);
    }

    .cart-item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .cart-item-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cart-item-name {
      font-weight: 500;
      color: var(--color-space);
      margin: 0;
      margin-bottom: 0.5rem;
    }

    .cart-item-meta {
      font-size: 0.875rem;
      color: var(--color-steel);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .cart-item-price {
      font-weight: 600;
      color: var(--color-space);
      min-width: 120px;
      text-align: right;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quantity-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-border);
      background: var(--color-vapor);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
    }

    .quantity-btn:hover {
      background: var(--color-smoke);
      border-color: var(--color-silver);
    }

    .quantity-input {
      width: 48px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
    }

    .remove-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-border);
      background: var(--color-vapor);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      color: var(--color-steel);
    }

    .remove-btn:hover {
      background: #fee;
      border-color: #f99;
      color: #c00;
    }

    .cart-summary {
      background: var(--color-smoke);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .summary-row:last-child {
      border-bottom: none;
      font-weight: 600;
      font-size: 1.125rem;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 2px solid var(--color-border);
    }

    .summary-label {
      color: var(--color-steel);
    }

    .summary-value {
      color: var(--color-space);
      font-weight: 500;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: var(--color-space);
      color: var(--color-vapor);
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .checkout-btn:hover {
      background: var(--color-steel);
      transform: translateY(-1px);
      box-shadow: var(--shadow-subtle);
    }

    .empty-cart {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-steel);
    }

    .empty-cart svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      color: var(--color-silver);
    }

    /* ===== MINIMALIST REVIEWS ===== */
    .product-review {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      transition: var(--transition);
    }

    .product-review:hover {
      border-color: var(--color-silver);
      box-shadow: var(--shadow-subtle);
    }

    .product-review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .review-date {
      font-size: 0.875rem;
      color: var(--color-steel);
    }

    .product-rating {
      color: var(--color-gold);
      font-size: 1rem;
    }

    /* ===== MINIMALIST MODAL ===== */
    .modal {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      border: none;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-elevated);
    }

    .modal-header {
      border-bottom: 1px solid var(--color-border);
      padding: 1.5rem;
    }

    .modal-title {
      font-family: 'Jost', sans-serif;
      font-weight: 600;
      color: var(--color-space);
    }

    .close {
      border: none;
      background: transparent;
      font-size: 1.5rem;
      color: var(--color-steel);
      cursor: pointer;
      transition: var(--transition);
    }

    .close:hover {
      color: var(--color-space);
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-label {
      font-weight: 500;
      color: var(--color-space);
      margin-bottom: 0.5rem;
    }

    .form-control {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--color-space);
      box-shadow: 0 0 0 3px rgba(1, 25, 50, 0.1);
      outline: none;
    }

    /* ===== MINIMALIST MAP ===== */
    .socialmap {
      margin: 2rem 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-subtle);
    }

    #map iframe {
      width: 100%;
      height: 400px;
      border: none;
      filter: grayscale(1);
      transition: filter 0.3s ease;
    }

    #map:hover iframe {
      filter: grayscale(0);
    }

    /* ===== MINIMALIST FOOTER ===== */
    .footer {
      background: var(--color-space);
      color: var(--color-vapor);
      padding: 3rem 0 1.5rem;
      margin-top: 4rem;
    }

    .footer__inner {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .footer-widget p.white {
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--color-vapor);
    }

    .footer-widget a.grey {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: var(--transition);
      display: block;
      margin-bottom: 0.5rem;
    }

    .footer-widget a.grey:hover {
      color: var(--color-vapor);
      transform: translateX(4px);
    }

    .subscribe-form-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--color-vapor);
      margin-bottom: 1rem;
    }

    .subscribe-form-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .subscribe-form-btn {
      background: var(--color-vapor);
      color: var(--color-space);
      border: none;
    }

    .subscribe-form-btn:hover {
      background: var(--color-smoke);
    }

    /* ===== RESPONSIVE ADJUSTMENTS ===== */
    @media (max-width: 768px) {
      .tabs__btn {
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }

      .cart-item {
        grid-template-columns: 60px 1fr;
      }

      .cart-item-price {
        grid-column: 1 / -1;
        text-align: left;
        margin-top: 1rem;
      }

      .container,
      .container1400 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    @media (max-width: 480px) {
      .grid-2 {
        gap: 20px;
      }

      .desc h5 {
        font-size: 1.5rem;
      }

      .cart-item-controls {
        flex-wrap: wrap;
      }
    }
  </style>
  <style>
    .breadcrumbs {
      padding: 24px 0;
      font-family: Jost;
      font-weight: 500;
    }

    .breadcrumbs ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .breadcrumbs li {
      display: flex;
      align-items: center;
    }

    .breadcrumbs li:not(:last-child)::after {
      content: "/";
      margin: 0 16px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .breadcrumbs a p {
      color: #64748b;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
      padding: 6px 12px;
      border-radius: 8px;

    }


    .breadcrumbs li:last-child a {
      color: #0f172a;
      font-weight: 500;
      /* background: #eff6ff; */
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- ========== ШАПКА (меню) ========== -->
  <header>
    <nav>
      <ul class="menu__list">
        <li class="menu__list-item">
          <a href="index.html" class="dropbtn">Главная</a>
        </li>
        <li class="menu__list-item">
          <a href="cart.html" class="dropbtn">Корзина(0)</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- ========== ОСНОВНОЙ КОНТЕНТ ========== -->
  <main>
    <div class="container1400 cart-container">
      <div class="cart-header">
        <h2 class="cart-title">Your Cart | Ваш продукт в корзине</h2>
        <span id="cart-total" class="fs-5 fw-semibold">0 ₽</span>
      </div>

      <div id="cart-items" class="cart-items">
        <!-- Cart items will be added here -->
        <div class="empty-cart">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
          </svg>
          <h5>Your cart is empty</h5>
          <p>Add items to get started</p>
        </div>
      </div>

      <div id="cart-summary" class="cart-summary" style="display: none;">
        <div class="summary-row">
          <span class="summary-label">Subtotal</span>
          <span id="subtotal" class="summary-value">0 ₽</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Shipping</span>
          <span class="summary-value">Free</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Total</span>
          <span id="total" class="summary-value">0 ₽</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z" />
          </svg>
          Proceed to Checkout
        </button>
      </div>
    </div>
  </main>

  <!-- ========== ПОДВАЛ ========== -->
  <footer>
    <!-- Ваш подвал -->
  </footer>

  <!-- ========== ПОДКЛЮЧЕНИЕ СКРИПТОВ ========== -->
